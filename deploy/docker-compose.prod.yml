# Producción, en ~/pfg de la VM. Rutas: ./src es el backend sincronizado por rsync,
# ./www el frontend compilado, ./.env los secretos (creados a mano, nunca sincronizados).
# Solo Caddy publica puertos; el resto queda en la red interna de Docker.

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: >
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c max_connections=100
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Init: SOLO corre con el volumen vacío. Arma lo mismo que la integración:
      #   01 base de liquidación (su db-init.sql, sin tocar)
      #   02 sus migraciones, con su runner
      #   03 nuestro paquete (database/paquete-personal.txt)
      # Nunca datos de demo: seed_demo.sql es solo local.
      # Con un volumen que ya existe no corre nada de esto: lo pendiente del paquete lo
      # aplica deploy/migrate.sh en cada deploy.
      # Los archivos de liquidación van comprimidos; postgres ejecuta el .sql.gz directamente.
      - ./src/database/liquidacion/db-init.sql.gz:/docker-entrypoint-initdb.d/01_liquidacion_db_init.sql.gz:ro
      - ./src/database/init/02_liquidacion_migraciones.sh:/docker-entrypoint-initdb.d/02_liquidacion_migraciones.sh:ro
      - ./src/database/init/03_paquete_personal.sh:/docker-entrypoint-initdb.d/03_paquete_personal.sh:ro
      - ./src/database:/database:ro
    healthcheck:
      # -h 127.0.0.1: durante el init postgres solo escucha por socket; por TCP responde
      # recién cuando terminó todo el init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Crea el bucket y el usuario del backend; el root queda solo para administrar.
  minio-init:
    image: minio/minio:latest
    container_name: minio-init
    entrypoint: ["/bin/sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_APP_USER: ${MINIO_APP_USER:?falta MINIO_APP_USER en el .env}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?falta MINIO_APP_PASSWORD en el .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-pfg-documents}
    volumes:
      - ./src/deploy/minio/init.sh:/init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Aplica el paquete de Personal (database/paquete-personal.txt) sobre la base.
  # Es el mismo script que se corre sobre la base de liquidación en la integración.
  # Lo lanza deploy/migrate.sh: docker compose --profile tools run --rm paquete-personal
  paquete-personal:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./src/database:/database:ro
    entrypoint: ["sh", "/database/aplicar-paquete-personal.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./src/backend
    container_name: backend
    env_file:
      - ./.env
    environment:
      # Lo que depende de la red interna de Docker, para que el .env no pueda romperlo.
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      NODE_ENV: production
      PORT: "3000"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_APP_USER:?falta MINIO_APP_USER en el .env}
      MINIO_SECRET_KEY: ${MINIO_APP_PASSWORD:?falta MINIO_APP_PASSWORD en el .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-pfg-documents}
      MINIO_USE_SSL: "false"
      # El env_file trae el root de MinIO: se vacía para que el backend no lo tenga.
      MINIO_ROOT_USER: ""
      MINIO_ROOT_PASSWORD: ""
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv/www:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
  caddy_data:
  caddy_config:
