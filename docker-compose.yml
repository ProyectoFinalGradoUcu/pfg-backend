services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: pfg_user
      POSTGRES_PASSWORD: pfg_password
      POSTGRES_DB: pfg_database
    ports:
      - "5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # Solo la base de liquidación, tal cual la tienen ellos (corre con el volumen vacío).
      # Encima van sus migraciones (servicio liquidacion-migraciones) y después nuestro
      # paquete (servicio paquete-personal), igual que en la integración. Ver `make reset`.
      # Va comprimido; postgres ejecuta los .sql.gz del init directamente.
      - ./database/liquidacion/db-init.sql.gz:/docker-entrypoint-initdb.d/01_liquidacion_db_init.sql.gz:ro
    healthcheck:
      # -h 127.0.0.1: mientras corre el init, postgres solo escucha por socket; por TCP
      # recién responde cuando terminó db-init.sql.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U pfg_user -d pfg_database"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Migraciones de liquidación con SU runner, igual que en su repo
  # (docker-compose --profile tools run --rm migrations). Vienen comprimidas en
  # database/liquidacion/migraciones.tar.gz; ver database/correr-migraciones-liquidacion.sh.
  liquidacion-migraciones:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: pfg_database
      DB_USER: pfg_user
      DB_PASSWORD: pfg_password
    volumes:
      - ./database:/database:ro
    entrypoint: ["sh", "/database/correr-migraciones-liquidacion.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Nuestro paquete encima de la base de liquidación: el mismo comando que se corre allá.
  paquete-personal:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: pfg_database
      DB_USER: pfg_user
      DB_PASSWORD: pfg_password
    volumes:
      - ./database:/database:ro
    entrypoint: ["sh", "/database/aplicar-paquete-personal.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: pfg_minio_user
      MINIO_ROOT_PASSWORD: pfg_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: backend
    env_file:
      - ./backend/.env
    environment:
      # Overrides del .env local: DATABASE_URL apunta al contenedor postgres, no a localhost
      DATABASE_URL: "postgresql://pfg_user:pfg_password@postgres:5432/pfg_database?schema=public"
      NODE_OPTIONS: "--dns-result-order=ipv4first"
      NODE_ENV: production
      JWT_EXPIRES_IN: "4h"
      MAX_LOGIN_ATTEMPTS: "5"
      LOCK_DURATION_MIN: "15"
      CORS_ORIGIN: "http://localhost:4200"
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: pfg_minio_user
      MINIO_SECRET_KEY: pfg_minio_password
      MINIO_BUCKET: pfg-documents
      MINIO_USE_SSL: "false"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:4200}"
      INVITATION_TTL_HOURS: "${INVITATION_TTL_HOURS:-48}"
      RESET_PASSWORD_TTL_HOURS: "${RESET_PASSWORD_TTL_HOURS:-1}"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
